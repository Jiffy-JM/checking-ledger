services:
  ledger:
    # Built on this machine by default. To run a published image instead, set
    # LEDGER_IMAGE in .env (see docs/PUBLISHING.md) and run
    #   docker compose pull ledger && docker compose up -d --no-build
    image: ${LEDGER_IMAGE:-checking-ledger:local}
    build: .
    container_name: checking-ledger
    # Only reachable at HOST_IP:HOST_PORT from your .env file. Without a
    # .env file it's only reachable from the server itself (127.0.0.1).
    ports:
      - "${HOST_IP:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    # Run as the owner of the data folder, never as root.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data
      # Written by the backup service below; the app only reads it.
      - ./backup-status:/backup-status:ro
    environment:
      TZ: ${TZ:-America/New_York}
      APP_PASSWORD: ${APP_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      THEME: ${THEME:-}
      THEME_MODE: ${THEME_MODE:-}
      BACKUP_STATUS_FILE: /backup-status/status.json
    # Lockdown: nothing in the container can be changed except the data
    # folder, and the app can't gain any extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional cloud backup. A separate container, so the app itself never
  # connects to the internet and never sees the storage keys.
  # Set it up in backup.env, then start it with:
  #   docker compose --profile backup up -d
  backup:
    profiles: ["backup"]
    image: restic/restic:0.19.1
    container_name: checking-ledger-backup
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: backup.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      HOME: /tmp
    volumes:
      # Read-only: the backup service can't change or delete your ledger.
      - ./data:/data:ro
      - ./backup:/backup:ro
      - ./backup-status:/status
      - ./restore:/restore
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
