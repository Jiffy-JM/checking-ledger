{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Unlock{% endblock %}
{% block content %}
<div class="mx-auto mt-10 max-w-sm">
  <h1 class="text-2xl font-bold tracking-tight">Unlock your ledger</h1>
  <form method="post" class="mt-6 space-y-4">
    {{ csrf() }}
    <div>
      <label class="label" for="password">Password</label>
      <input class="field" type="password" id="password" name="password" autocomplete="current-password" autofocus required{% if error %} aria-invalid="true" aria-describedby="pw-error"{% endif %}>
      {% if error %}<p class="field-error" id="pw-error">{{ error }}</p>{% endif %}
    </div>
    <button class="btn-primary w-full">Unlock</button>
  </form>
</div>
{% endblock %}
